<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - QR Scanner</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <div class="container admin-container">
        <header>
            <h1>Admin Portal</h1>
            <p class="subtitle">Student QR Code Scanner</p>
        </header>

        <div class="scanner-section">
            <div class="scanner-box">
                <div id="reader"></div>
                <div class="scanner-controls">
                    <button id="startScan" class="btn-scan">Start Scanner</button>
                    <button id="stopScan" class="btn-stop" style="display:none;">Stop Scanner</button>
                </div>
            </div>

            <div class="manual-entry">
                <h3>Or Enter QR Data Manually</h3>
                <div class="form-group">
                    <textarea id="manualInput" placeholder="Paste QR code data here..." rows="3"></textarea>
                </div>
                <button id="manualScan" class="btn-submit">Process Data</button>
            </div>
        </div>

        <!-- Student Details Display -->
        <div id="studentDetails" class="student-details" style="display:none;">
            <h2>Student Details</h2>
            <div class="details-card">
                <div class="detail-row">
                    <span class="label">Student ID:</span>
                    <span id="detailId" class="value"></span>
                </div>
                <div class="detail-row">
                    <span class="label">Name:</span>
                    <span id="detailName" class="value"></span>
                </div>
                <div class="detail-row">
                    <span class="label">Registration No:</span>
                    <span id="detailRegNo" class="value"></span>
                </div>
                <div class="detail-row">
                    <span class="label">College:</span>
                    <span id="detailCollege" class="value"></span>
                </div>
                <div class="detail-row">
                    <span class="label">Course/Branch:</span>
                    <span id="detailCourse" class="value"></span>
                </div>
                <div class="detail-row">
                    <span class="label">Student Type:</span>
                    <span id="detailType" class="value"></span>
                </div>
                <div class="detail-row">
                    <span class="label">Blood Group:</span>
                    <span id="detailBlood" class="value"></span>
                </div>
                <div class="detail-row">
                    <span class="label">Status:</span>
                    <span id="detailStatus" class="value status-valid">✓ Verified</span>
                </div>
            </div>
            <button id="clearDetails" class="btn-clear">Clear & Scan Next</button>
        </div>

        <!-- Scan History -->
        <div class="scan-history">
            <h2>Recent Scans</h2>
            <div id="scanHistory" class="history-list">
                <p class="no-scans">No scans yet</p>
            </div>
        </div>
    </div>

    <script src="js/colleges-data.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
